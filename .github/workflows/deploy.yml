name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_content_snapshot:
        description: "Sources unreachable: build from content/snapshot (ships stale content — the run says what and since when)"
        type: boolean
        default: false
      skip_tests:
        description: "npm unreachable: publish without the test job (emergency only)"
        type: boolean
        default: false
      skip_invalid_rows:
        description: "Bad rows in the sheet: publish the rows that validate and leave the invalid ones out (does not update the snapshot)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # A fixed path rather than runner.temp, which no workflow-level context can
  # see. build.mjs writes the failure class here and the mail step reads it.
  BUILD_REPORT: /tmp/mmaf-build-report.json

jobs:
  test:
    # The gate stays exactly as strict on a push. It can only be stepped around
    # by dispatching the workflow and ticking skip_tests — one deliberate act,
    # for the festival-Saturday case where npm is down and a fix has to ship.
    #
    # Both comparisons are deliberate: the Actions UI sends a real boolean, and
    # `gh workflow run -f skip_tests=true` sends the string. GitHub's loose
    # equality casts a bool to a number and a string to NaN, so true == 'true'
    # is false — one comparison would silently ignore the other caller.
    if: ${{ inputs.skip_tests != true && inputs.skip_tests != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Restores ~/.npm keyed on the lockfile.
          cache: npm
      # --prefer-offline serves what the cache already has instead of asking the
      # registry, so an npm outage stops blocking code deploys on an unchanged
      # lockfile. --no-audit/--no-fund drop the other two registry round-trips.
      - run: npm ci --prefer-offline --no-audit --no-fund
      # The browser download is the slowest step and changes only when
      # @playwright/test does, so it is keyed on the lockfile.
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # System libraries live outside the cached directory, so they are
      # installed even on a hit.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
      - name: Email the failure
        # Deliberately allowed to fail: this only runs on an already-failed
        # run, and an unsent alarm must show as a red step, not hide behind a
        # green one (ruled 2026-08-22).
        if: failure()
        env:
          FASTMAIL_USER: ${{ secrets.FASTMAIL_USER || vars.FASTMAIL_USER }}
          FASTMAIL_APP_PASSWORD: ${{ secrets.FASTMAIL_APP_PASSWORD }}
          DEPLOY_NOTIFICATION_EMAIL: ${{ secrets.DEPLOY_NOTIFICATION_EMAIL || vars.DEPLOY_NOTIFICATION_EMAIL }}
          CONTENT_NOTIFICATION_EMAIL: ${{ secrets.CONTENT_NOTIFICATION_EMAIL || vars.CONTENT_NOTIFICATION_EMAIL }}
        run: node .github/scripts/notify-failure.mjs

  deploy:
    needs: test
    # skip_tests skips the test job outright, so "skipped" has to be as good as
    # "success" here — while a real test failure still stops the deploy.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      # contents: write is for the snapshot refresh below, and is scoped to this
      # job so the test job cannot write to the repo.
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # the site build itself has zero npm dependencies
      - name: Build the site
        env:
          USE_SNAPSHOT: ${{ inputs.use_content_snapshot }}
          SKIP_INVALID_ROWS: ${{ inputs.skip_invalid_rows }}
        run: |
          flags=""
          if [ "$USE_SNAPSHOT" = "true" ]; then
            flags="$flags --use-snapshot"
            echo "::notice::Unreachable sources will be served from content/snapshot for this run."
          fi
          # --write-snapshot is dropped rather than made conditional inside the
          # build: a run that knowingly published less than the sheet holds must
          # not become the copy a later --use-snapshot run trusts. build.mjs
          # refuses the two flags together, so this branch is the contract, not
          # a convention.
          if [ "$SKIP_INVALID_ROWS" = "true" ]; then
            flags="$flags --skip-invalid-rows"
            echo "::notice::Rows that fail validation will be left out of this build, and the snapshot will not be updated."
          else
            flags="$flags --write-snapshot"
          fi
          node scripts/build.mjs $flags --report "$BUILD_REPORT"
          node scripts/build-sw.mjs
      # Every date below comes from the snapshot's own record of when those
      # bytes last changed, never from the build clock: content.json must stay
      # byte-identical for identical sources, fallback or not.
      - name: Flag stale content
        run: |
          node -e '
            const { existsSync, readFileSync, appendFileSync } = require("node:fs");
            const reportPath = process.env.BUILD_REPORT;
            if (!existsSync(reportPath)) process.exit(0);
            const used = (JSON.parse(readFileSync(reportPath, "utf8")).snapshot || {}).used || [];
            if (used.length === 0) process.exit(0);
            const lines = used.map((e) => e.label + " — saved bytes unchanged since " + (e.lastChanged || "an unrecorded date"));
            console.log("::warning title=Published stale content::" + lines.join("; "));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, ["## Published from the content snapshot", "", "These sources could not be reached, so this deploy shipped saved copies:", "", ...lines.map((l) => "- " + l), ""].join("\n"));
          '
      # A skipped-row run is green, so nothing else would say that the site now
      # holds less than the sheet does. The rows still need fixing, and this is
      # where the operator who ticked the box goes looking.
      - name: Flag skipped rows
        run: |
          node -e '
            const { existsSync, readFileSync, appendFileSync } = require("node:fs");
            const reportPath = process.env.BUILD_REPORT;
            if (!existsSync(reportPath)) process.exit(0);
            const dropped = JSON.parse(readFileSync(reportPath, "utf8")).droppedRows || [];
            if (dropped.length === 0) process.exit(0);
            // Flattened on the way out for the same reason the build log is:
            // these strings quote spreadsheet cells, and a cell containing a
            // newline must not forge extra log lines.
            const lines = dropped.map((d) => String(d.message).replace(/\s+/g, " ").trim() + (d.logoOnly ? " (published without its logo)" : ""));
            console.log("::warning title=Published without " + dropped.length + " invalid row(s)::" + lines.join("; "));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, ["## Published without " + dropped.length + " invalid row(s)", "", "These rows failed validation and were left out of this deploy. The snapshot was not updated, so it still holds the last fully valid content:", "", ...lines.map((l) => "- " + l), "", "Fix them in the spreadsheet; the next normal run publishes them.", ""].join("\n"));
          '
      - name: Commit the refreshed snapshot
        # Only from main: this workflow can be dispatched against any ref, and
        # the push below writes to main whatever the checkout holds.
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain content/snapshot)" ]; then
            echo "Content snapshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/snapshot
          git commit -m "refresh content snapshot [skip ci]"
          # Best-effort by design: a concurrent push wins the race and the next
          # successful run refreshes the snapshot again. Pushes made with the
          # ambient token do not trigger workflows; [skip ci] is belt-and-braces
          # against a loop if that ever changes.
          git push origin HEAD:main || echo "::warning::Could not push the refreshed snapshot; the next successful run will retry."
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Email the failure
        # Deliberately allowed to fail: this only runs on an already-failed
        # run, and an unsent alarm must show as a red step, not hide behind a
        # green one (ruled 2026-08-22).
        if: failure()
        env:
          FASTMAIL_USER: ${{ secrets.FASTMAIL_USER || vars.FASTMAIL_USER }}
          FASTMAIL_APP_PASSWORD: ${{ secrets.FASTMAIL_APP_PASSWORD }}
          DEPLOY_NOTIFICATION_EMAIL: ${{ secrets.DEPLOY_NOTIFICATION_EMAIL || vars.DEPLOY_NOTIFICATION_EMAIL }}
          CONTENT_NOTIFICATION_EMAIL: ${{ secrets.CONTENT_NOTIFICATION_EMAIL || vars.CONTENT_NOTIFICATION_EMAIL }}
        run: node .github/scripts/notify-failure.mjs
