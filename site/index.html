<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midway Circuit Map</title>
<meta name="description" content="Offline-friendly map and schedule for the Midway Music &amp; Arts Festival.">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10577b">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

<link rel="stylesheet" href="css/app.css">
<script src="js/sw-register.js" defer></script>
<script type="module">
// Boot guard. On a first, uncached visit the app loads as a static module
// graph, and one failed fetch (e.g. a transient CDN 503 on a congested
// network) kills the whole graph. Failed module fetches are cached for the
// page's lifetime, so the only reliable retry is a reload — auto, capped,
// with backoff, then a manual button. Once the service worker is installed
// this path can no longer fail: every module is served cache-first.
(async () => {
  const KEY = 'mfc:boot-attempts';
  try {
    await import('./js/app.js');
    sessionStorage.removeItem(KEY);
  } catch (err) {
    console.error('app failed to load', err);
    const view = document.getElementById('view');
    const show = (html) => { if (view) view.innerHTML = html; };
    const attempt = Number(sessionStorage.getItem(KEY) || '0');
    if (attempt < 3) {
      sessionStorage.setItem(KEY, String(attempt + 1));
      show('<p class="splash">Having trouble loading &mdash; retrying&hellip;</p>');
      setTimeout(() => location.reload(), [1000, 3000, 8000][attempt]);
    } else {
      sessionStorage.removeItem(KEY);
      show('<p class="splash">Couldn&rsquo;t load the app &mdash; check your connection.</p>' +
        '<p style="text-align:center"><button class="btn btn--primary" onclick="location.reload()">Try again</button></p>');
    }
  }
})();
</script>
</head>
<body>

      <line x1="9" y1="4.3" x2="9" y2="18.3" stroke="currentColor" stroke-width="1.4"/>
      <line x1="15" y1="6.3" x2="15" y2="20.3" stroke="currentColor" stroke-width="1.4"/>

</body>
</html>
